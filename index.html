<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Invaders Retro Arcade</title>
  <meta name="description" content="A complete retro arcade Space Invaders canvas game with alien waves, shooting mechanics, score tracking, and restart capabilities." />
  <meta property="og:title" content="Space Invaders Retro Arcade" />
  <meta property="og:description" content="A complete retro arcade Space Invaders canvas game with alien waves, shooting mechanics, score tracking, and restart capabilities." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #050505;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    #game-container {
      position: relative;
      width: 800px;
      height: 600px;
      background: #000000;
      border: 3px solid #00ff66;
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.35);
    }
    canvas {
      display: block;
      background-color: #000000;
      image-rendering: pixelated;
    }
    #restart-btn {
      display: none;
      position: absolute;
      top: 62%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 14px 36px;
      font-size: 22px;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #000000;
      background-color: #00ff66;
      border: 3px solid #ffffff;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.8), 0 0 40px rgba(0, 255, 102, 0.4);
      transition: transform 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
      z-index: 10;
    }
    #restart-btn:hover {
      background-color: #ffffff;
      color: #000000;
      transform: translate(-50%, -50%) scale(1.06);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.9), 0 0 50px rgba(0, 255, 102, 0.6);
    }
    #controls-hint {
      margin-top: 14px;
      font-size: 14px;
      color: #777777;
      letter-spacing: 1px;
      text-align: center;
    }
    #controls-hint span {
      color: #00ff66;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <button id="restart-btn">Restart</button>
  </div>
  <div id="controls-hint">
    [<span>&larr;</span> / <span>A</span>] Left &nbsp;|&nbsp; [<span>&rarr;</span> / <span>D</span>] Right &nbsp;|&nbsp; [<span>SPACE</span>] Shoot Laser
  </div>

  <script>
    // --- Canvas & Context Setup ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const restartBtn = document.getElementById('restart-btn');

    // --- Sound Synthesizer (Zero external assets, Web Audio API) ---
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playTone(freq, duration, type = 'square', vol = 0.08) {
      try {
        if (!audioCtx) {
          audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        // Safe fallback if audio context is blocked
      }
    }

    function soundPlayerShoot() {
      playTone(880, 0.1, 'square', 0.05);
    }

    function soundAlienHit() {
      playTone(220, 0.15, 'sawtooth', 0.08);
    }

    function soundPlayerHit() {
      playTone(90, 0.45, 'sawtooth', 0.15);
    }

    // --- Game Constants & Configuration ---
    const ALIEN_ROWS = 5;
    const ALIEN_COLS = 8;
    const ALIEN_WIDTH = 38;
    const ALIEN_HEIGHT = 24;
    const ALIEN_GAP_X = 26;
    const ALIEN_GAP_Y = 18;
    const ALIEN_DROP_DIST = 20;

    const PLAYER_WIDTH = 48;
    const PLAYER_HEIGHT = 22;
    const PLAYER_SPEED = 5.5;
    const PLAYER_COOLDOWN_FRAMES = 16; // Cooldown for firing

    const PLAYER_BULLET_WIDTH = 4;
    const PLAYER_BULLET_HEIGHT = 12;
    const PLAYER_BULLET_SPEED = 8.5;

    const ALIEN_BULLET_WIDTH = 4;
    const ALIEN_BULLET_HEIGHT = 10;
    const ALIEN_BULLET_SPEED = 4;

    // --- Game State Variables ---
    let score = 0;
    let isGameOver = false;
    let animationFrameId = null;

    let player = {
      x: (canvas.width - PLAYER_WIDTH) / 2,
      y: canvas.height - 46,
      width: PLAYER_WIDTH,
      height: PLAYER_HEIGHT,
      speed: PLAYER_SPEED,
      cooldownTimer: 0
    };

    let aliens = [];
    let alienDirection = 1; // 1 = Right, -1 = Left
    let alienSpeed = 1.3;
    let alienShootCooldown = 60;

    let playerBullets = [];
    let alienBullets = [];

    // Background Stars for retro atmosphere
    const stars = [];
    for (let i = 0; i < 45; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() < 0.25 ? 2 : 1,
        color: Math.random() < 0.3 ? '#88ff88' : '#ffffff'
      });
    }

    // --- Keyboard Input Handling ---
    const keys = {
      left: false,
      right: false,
      shoot: false
    };

    window.addEventListener('keydown', (e) => {
      // Prevent default scrolling for game controls
      if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' ', 'Space'].includes(e.key)) {
        e.preventDefault();
      }

      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        keys.left = true;
      }
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        keys.right = true;
      }
      if (e.key === ' ' || e.code === 'Space') {
        keys.shoot = true;
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        keys.left = false;
      }
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        keys.right = false;
      }
      if (e.key === ' ' || e.code === 'Space') {
        keys.shoot = false;
      }
    });

    // --- Alien Initialization ---
    function initAliens() {
      aliens = [];
      const totalGridWidth = ALIEN_COLS * ALIEN_WIDTH + (ALIEN_COLS - 1) * ALIEN_GAP_X;
      const startX = (canvas.width - totalGridWidth) / 2;
      const startY = 65;

      for (let row = 0; row < ALIEN_ROWS; row++) {
        // Retro arcade alien types:
        // Row 0: Red Commander (30 pts)
        // Rows 1-2: Yellow/Orange Raider (20 pts)
        // Rows 3-4: White/Cyan Invader (10 pts)
        let color = '#ffffff';
        let points = 10;
        let alienType = 1;

        if (row === 0) {
          color = '#ff3366'; // Neon Red/Pink
          points = 30;
          alienType = 3;
        } else if (row === 1 || row === 2) {
          color = '#ffcc00'; // Neon Yellow
          points = 20;
          alienType = 2;
        } else {
          color = '#00e5ff'; // Neon Cyan
          points = 10;
          alienType = 1;
        }

        for (let col = 0; col < ALIEN_COLS; col++) {
          aliens.push({
            x: startX + col * (ALIEN_WIDTH + ALIEN_GAP_X),
            y: startY + row * (ALIEN_HEIGHT + ALIEN_GAP_Y),
            width: ALIEN_WIDTH,
            height: ALIEN_HEIGHT,
            color: color,
            points: points,
            type: alienType,
            alive: true
          });
        }
      }

      alienDirection = 1;
      alienSpeed = 1.4;
      alienShootCooldown = 45;
    }

    // --- Reset Game Function ---
    function resetGame() {
      score = 0;
      isGameOver = false;

      player.x = (canvas.width - PLAYER_WIDTH) / 2;
      player.y = canvas.height - 46;
      player.cooldownTimer = 0;

      playerBullets = [];
      alienBullets = [];

      keys.left = false;
      keys.right = false;
      keys.shoot = false;

      initAliens();
    }

    // --- AABB (Axis-Aligned Bounding Box) Collision Detection ---
    function checkCollision(rect1, rect2) {
      return (
        rect1.x < rect2.x + rect2.width &&
        rect1.x + rect1.width > rect2.x &&
        rect1.y < rect2.y + rect2.height &&
        rect1.y + rect1.height > rect2.y
      );
    }

    // --- Drawing Functions Using ctx.fillRect Primitives ---

    // Draw Player Tank using blocky rects
    function drawPlayer() {
      ctx.fillStyle = '#00ff66'; // Neon Green

      // Main base
      ctx.fillRect(player.x, player.y + 12, player.width, 10);
      // Mid turret
      ctx.fillRect(player.x + 8, player.y + 6, player.width - 16, 6);
      // Gun barrel
      ctx.fillRect(player.x + player.width / 2 - 3, player.y, 6, 6);
      // Treads
      ctx.fillStyle = '#00cc52';
      ctx.fillRect(player.x + 2, player.y + 18, 6, 4);
      ctx.fillRect(player.x + player.width - 8, player.y + 18, 6, 4);
    }

    // Draw Alien based on its row type using blocky rects
    function drawAlien(alien) {
      const x = alien.x;
      const y = alien.y;
      const w = alien.width;
      const h = alien.height;

      ctx.fillStyle = alien.color;

      if (alien.type === 3) {
        // Top row: Flying saucer / Commander
        ctx.fillRect(x + 10, y, w - 20, 4);
        ctx.fillRect(x + 4, y + 4, w - 8, 8);
        ctx.fillRect(x, y + 12, w, 6);
        ctx.fillRect(x + 6, y + 18, 6, 6);
        ctx.fillRect(x + w - 12, y + 18, 6, 6);
        // Cutout eye slits with black rects
        ctx.fillStyle = '#000000';
        ctx.fillRect(x + 10, y + 8, 4, 4);
        ctx.fillRect(x + w - 14, y + 8, 4, 4);
      } else if (alien.type === 2) {
        // Middle rows: Crab-like invader
        ctx.fillRect(x + 4, y, 4, 4);
        ctx.fillRect(x + w - 8, y, 4, 4);
        ctx.fillRect(x + 8, y + 4, w - 16, 4);
        ctx.fillRect(x + 4, y + 8, w - 8, 6);
        ctx.fillRect(x, y + 14, w, 4);
        ctx.fillRect(x + 2, y + 18, 6, 6);
        ctx.fillRect(x + w - 8, y + 18, 6, 6);
        ctx.fillRect(x + 14, y + 18, w - 28, 4);
        // Eyes
        ctx.fillStyle = '#000000';
        ctx.fillRect(x + 8, y + 10, 4, 4);
        ctx.fillRect(x + w - 12, y + 10, 4, 4);
      } else {
        // Bottom rows: Squid-like invader
        ctx.fillRect(x + 12, y, w - 24, 4);
        ctx.fillRect(x + 6, y + 4, w - 12, 6);
        ctx.fillRect(x + 2, y + 10, w - 4, 6);
        ctx.fillRect(x, y + 16, 6, 8);
        ctx.fillRect(x + 10, y + 16, 6, 6);
        ctx.fillRect(x + w - 16, y + 16, 6, 6);
        ctx.fillRect(x + w - 6, y + 16, 6, 8);
        // Eyes
        ctx.fillStyle = '#000000';
        ctx.fillRect(x + 8, y + 8, 4, 4);
        ctx.fillRect(x + w - 12, y + 8, 4, 4);
      }
    }

    // --- Game Over Trigger ---
    function triggerGameOver() {
      if (isGameOver) return;
      isGameOver = true;
      soundPlayerHit();

      // Halt the game loop
      if (animationFrameId !== null) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }

      // Draw final Game Over frame
      renderScene();

      // Display large GAME OVER text
      ctx.save();
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#ff0033';
      ctx.font = 'bold 56px "Courier New", Courier, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = '#ff0033';
      ctx.shadowBlur = 18;
      ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 35);

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff';
      ctx.font = '22px "Courier New", Courier, monospace';
      ctx.fillText('FINAL SCORE: ' + score, canvas.width / 2, canvas.height / 2 + 18);
      ctx.restore();

      // Show the Restart button overlay
      restartBtn.style.display = 'block';
    }

    // --- Update Logic ---
    function update() {
      // 1. Update Player Movement
      if (keys.left) {
        player.x -= player.speed;
      }
      if (keys.right) {
        player.x += player.speed;
      }

      // Prevent player from moving off-screen
      if (player.x < 8) {
        player.x = 8;
      }
      if (player.x + player.width > canvas.width - 8) {
        player.x = canvas.width - 8 - player.width;
      }

      // 2. Player Weapon & Cooldown
      if (player.cooldownTimer > 0) {
        player.cooldownTimer--;
      }

      if (keys.shoot && player.cooldownTimer === 0) {
        playerBullets.push({
          x: player.x + player.width / 2 - PLAYER_BULLET_WIDTH / 2,
          y: player.y - PLAYER_BULLET_HEIGHT,
          width: PLAYER_BULLET_WIDTH,
          height: PLAYER_BULLET_HEIGHT,
          speed: PLAYER_BULLET_SPEED
        });
        player.cooldownTimer = PLAYER_COOLDOWN_FRAMES;
        soundPlayerShoot();
      }

      // 3. Update Player Bullets
      for (let i = playerBullets.length - 1; i >= 0; i--) {
        const b = playerBullets[i];
        b.y -= b.speed;
        if (b.y + b.height < 0) {
          playerBullets.splice(i, 1);
        }
      }

      // 4. Update Alien Grid Movement
      const livingAliens = aliens.filter(a => a.alive);

      // If all aliens cleared, spawn a fresh new wave with bonus points!
      if (livingAliens.length === 0) {
        score += 500;
        initAliens();
        return;
      }

      // Check if any alien reaches screen boundaries to shift group down and reverse direction
      let shouldShiftDown = false;
      for (const alien of livingAliens) {
        if (alienDirection === 1 && alien.x + alien.width >= canvas.width - 12) {
          shouldShiftDown = true;
          break;
        } else if (alienDirection === -1 && alien.x <= 12) {
          shouldShiftDown = true;
          break;
        }
      }

      if (shouldShiftDown) {
        alienDirection *= -1;
        // Shift entire group downward
        for (const alien of livingAliens) {
          alien.y += ALIEN_DROP_DIST;
        }
        // Slightly increase speed as invaders advance
        if (alienSpeed < 3.5) {
          alienSpeed += 0.08;
        }
      } else {
        // Move horizontally as a coordinated group
        for (const alien of livingAliens) {
          alien.x += alienDirection * alienSpeed;
        }
      }

      // 5. Alien vs Player Collision (If aliens descend to player's level)
      for (const alien of livingAliens) {
        if (alien.y + alien.height >= player.y || checkCollision(alien, player)) {
          triggerGameOver();
          return;
        }
      }

      // 6. Alien Shooting (Random but infrequent downward projectiles)
      alienShootCooldown--;
      if (alienShootCooldown <= 0) {
        // Choose bottom-most alien from a randomly chosen occupied column
        const colsMap = {};
        for (const alien of livingAliens) {
          const colIndex = Math.round((alien.x - 10) / (ALIEN_WIDTH + ALIEN_GAP_X));
          if (!colsMap[colIndex] || colsMap[colIndex].y < alien.y) {
            colsMap[colIndex] = alien;
          }
        }
        const activeShooters = Object.values(colsMap);
        if (activeShooters.length > 0) {
          const shooter = activeShooters[Math.floor(Math.random() * activeShooters.length)];
          alienBullets.push({
            x: shooter.x + shooter.width / 2 - ALIEN_BULLET_WIDTH / 2,
            y: shooter.y + shooter.height,
            width: ALIEN_BULLET_WIDTH,
            height: ALIEN_BULLET_HEIGHT,
            speed: ALIEN_BULLET_SPEED
          });
        }
        // Reset shooting cooldown randomly between 40 and 80 frames
        alienShootCooldown = 40 + Math.floor(Math.random() * 40);
      }

      // 7. Update Alien Bullets
      for (let i = alienBullets.length - 1; i >= 0; i--) {
        const b = alienBullets[i];
        b.y += b.speed;
        if (b.y > canvas.height) {
          alienBullets.splice(i, 1);
        }
      }

      // 8. Collision Detection: Player Bullet vs Alien (AABB)
      for (let bi = playerBullets.length - 1; bi >= 0; bi--) {
        const pBullet = playerBullets[bi];
        for (let ai = 0; ai < aliens.length; ai++) {
          const alien = aliens[ai];
          if (alien.alive && checkCollision(pBullet, alien)) {
            // Destroy both bullet and alien
            alien.alive = false;
            playerBullets.splice(bi, 1);
            score += alien.points;
            soundAlienHit();
            break;
          }
        }
      }

      // 9. Collision Detection: Alien Bullet vs Player (AABB)
      for (let bi = 0; bi < alienBullets.length; bi++) {
        const aBullet = alienBullets[bi];
        if (checkCollision(aBullet, player)) {
          triggerGameOver();
          return;
        }
      }
    }

    // --- Render Logic ---
    function renderScene() {
      // Clear screen with deep retro black
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw background stars
      for (const s of stars) {
        ctx.fillStyle = s.color;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      }

      // Draw bottom defensive barrier line
      ctx.fillStyle = '#00ff66';
      ctx.fillRect(0, canvas.height - 14, canvas.width, 2);

      // Draw all alive aliens
      for (const alien of aliens) {
        if (alien.alive) {
          drawAlien(alien);
        }
      }

      // Draw player tank
      drawPlayer();

      // Draw Player Bullets (Neon Green / Cyan Laser)
      ctx.fillStyle = '#00ffff';
      for (const b of playerBullets) {
        ctx.fillRect(b.x, b.y, b.width, b.height);
      }

      // Draw Alien Bullets (Red Laser)
      ctx.fillStyle = '#ff3333';
      for (const b of alienBullets) {
        ctx.fillRect(b.x, b.y, b.width, b.height);
      }

      // Draw Running Score in Top-Left Corner
      ctx.fillStyle = '#00ff66';
      ctx.font = 'bold 22px "Courier New", Courier, monospace';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText('SCORE: ' + score, 20, 18);

      // Top decorative border line
      ctx.fillStyle = '#222222';
      ctx.fillRect(0, 48, canvas.width, 1);
    }

    // --- Game Loop ---
    function gameLoop() {
      if (isGameOver) return;
      update();
      if (!isGameOver) {
        renderScene();
        animationFrameId = requestAnimationFrame(gameLoop);
      }
    }

    // --- Restart Button Click Handler ---
    restartBtn.addEventListener('click', () => {
      restartBtn.style.display = 'none';
      resetGame();
      gameLoop();
    });

    // --- Initial Game Launch ---
    resetGame();
    gameLoop();
  </script>
</body>
</html>
